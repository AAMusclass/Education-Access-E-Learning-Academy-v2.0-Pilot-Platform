<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08264d">
<meta name="description" content="Education Access E-Learning Academy — a structured learning and progress platform.">
<title>Education Access E-Learning Academy | v2.1</title>
<style>
:root{--navy:#08264d;--navy2:#0d3769;--blue:#1479e8;--sky:#eaf4ff;--ink:#132238;--muted:#65758b;--line:#dce6f1;--white:#fff;--green:#159a70;--amber:#e6a21a;--purple:#7357d8;--red:#d9485f;--shadow:0 14px 40px rgba(8,38,77,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:258px;background:linear-gradient(180deg,var(--navy),#061b36);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 26px}.brand-mark{width:46px;height:46px;border:2px solid #f5c451;border-radius:14px;display:grid;place-items:center;font-size:25px}.brand h1{font-size:14px;line-height:1.25;margin:0}.brand small{color:#9ecbff}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#c8d7eb;text-align:left;padding:13px 14px;border-radius:12px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#1479e8,#2363c8);color:#fff}.sidebar-foot{position:absolute;bottom:22px;left:24px;right:24px;color:#9bb4d3;font-size:12px}.main{flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px;position:sticky;top:0;z-index:10}.search{flex:1;max-width:540px;display:flex;align-items:center;gap:10px;background:#f4f7fb;border:1px solid var(--line);border-radius:999px;padding:11px 16px}.search input{width:100%;border:0;background:transparent;outline:0}.user-mini{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dcecff;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.content{padding:28px;max-width:1600px;margin:auto}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(110deg,#126fdb,#0a3a79);color:#fff;border-radius:24px;padding:30px;display:flex;justify-content:space-between;gap:24px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);right:-90px;top:-120px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;opacity:.8}.hero h2{font-size:34px;margin:8px 0}.hero p{max-width:650px;color:#dcecff}.hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.stat-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:10px 13px;border-radius:12px;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 14px}.section-head h2{margin:0;font-size:20px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.action{display:flex;align-items:flex-start;gap:13px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;transition:.15s}.action:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.iconbox{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--sky);flex-shrink:0}.action h3,.subject h3{font-size:15px;margin:0 0 5px}.action p,.subject p{font-size:12px;color:var(--muted);margin:0}.subject{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.subject-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:8px;background:#edf2f7;border-radius:99px;overflow:hidden;margin-top:15px}.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1479e8,#31b5e9)}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#edf5ff;color:#1768c4;font-size:11px;font-weight:700}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(8,38,77,.10)}.btn:focus-visible,.nav button:focus-visible,.action:focus-visible{outline:3px solid #8cc8ff;outline-offset:3px}.btn:active,.action:active{transform:translateY(0)}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#edf4fc;color:#145ba8}.btn-danger{background:#fff0f2;color:#b32643}.btn-small{padding:7px 10px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.empty{padding:25px;text-align:center;color:var(--muted)}.profile-layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.profile-card{text-align:center}.profile-large{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#e7f1ff;border:5px solid #fff;box-shadow:0 0 0 1px var(--line)}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:700;color:#45566d}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e5f1ff}.lesson-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.lesson-body{line-height:1.75}.lesson-body h3{color:var(--navy)}.question{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.question label{display:block;margin:8px 0;font-size:14px}.notice{padding:13px 15px;background:#fff8e5;border:1px solid #f3df9b;border-radius:12px;color:#805d0a;font-size:13px}.footer{padding:25px 28px;color:var(--muted);font-size:12px;text-align:center}.mobile-toggle{display:none}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-layout{grid-template-columns:1fr}.sidebar{width:220px}.hero{flex-direction:column}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;left:-280px;z-index:30;transition:.2s;width:260px}.sidebar.open{left:0}.mobile-toggle{display:block;border:0;background:#edf4fc;padding:10px;border-radius:10px}.topbar{padding:0 16px}.content{padding:18px}.grid-3,.grid-2,.grid-4{grid-template-columns:1fr}.hero h2{font-size:27px}.search{display:none}.sidebar-foot{position:static;margin-top:30px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">📖</div><div><h1>Education Access<br><span style="color:#55b8ff">E-Learning Academy</span></h1><small>Learn • Grow • Achieve</small></div></div>
  <nav class="nav" id="nav">
    <button data-view="dashboard" class="active">🏠 Dashboard</button><button data-view="courses">📚 My Courses</button><button data-view="assignments">📝 Assignments</button><button data-view="assessments">📊 Assessments</button><button data-view="progress">📈 Progress</button><button data-view="profiles">👥 Profiles</button><button data-view="parent">🛡️ Parent / Teacher</button><button data-view="settings">⚙️ Settings</button>
  </nav>
  <div class="sidebar-foot">Education Access E-Learning Academy v2.1<br><br>Structured learning for confident futures.</div>
</aside>
<main class="main">
<header class="topbar"><button class="mobile-toggle" id="menuBtn">☰</button><div class="search">🔎 <input id="searchInput" placeholder="Search lessons, assignments and subjects…"></div><div class="user-mini"><span id="topName">Brielle</span><img class="avatar" id="topAvatar" alt="Brielle profile photo"></div></header>
<div class="content">
<section class="view active" id="view-dashboard"></section>
<section class="view" id="view-courses"></section>
<section class="view" id="view-assignments"></section>
<section class="view" id="view-assessments"></section>
<section class="view" id="view-progress"></section>
<section class="view" id="view-profiles"></section>
<section class="view" id="view-parent"></section>
<section class="view" id="view-settings"></section>
</div>
<footer class="footer">Education Access E-Learning Academy • v2.1 • Local-first learning foundation • Protect personal data before public deployment.</footer>
</main></div>
<script>
'use strict';
const STORAGE_KEY='EA_ELEARNING_V21_Brielle';
const LEGACY_KEYS=['EA_ELEARNING_V20_Briela','EA_ELEARNING_V20_Brielle'];
const SUBJECTS=[
{id:'math',name:'Mathematics',icon:'🧮',color:'#1479e8',topics:['Whole Numbers and Place Value','Operations and Mental Mathematics','Fractions, Decimals and Percentages','Measurement and Geometry','Patterns, Data and Problem Solving']},
{id:'english',name:'English',icon:'📘',color:'#7357d8',topics:['Reading Comprehension','Vocabulary and Spelling','Grammar and Sentence Building','Writing and Composition','Speaking and Listening']},
{id:'kiswahili',name:'Kiswahili',icon:'🗣️',color:'#159a70',topics:['Kusoma na Ufahamu','Sarufi','Msamiati','Kuandika','Kusikiliza na Kuzungumza']},
{id:'science',name:'Science',icon:'🔬',color:'#e6a21a',topics:['Living Things','Matter and Materials','Energy and Forces','Earth and Environment','Investigation and Safety']},
{id:'geography',name:'Geography',icon:'🌍',color:'#0891b2',topics:['Maps and Directions','Weather and Climate','Landforms','Resources and Environment','People and Places']},
{id:'history',name:'History',icon:'🏛️',color:'#b66a30',topics:['Sources of History','Communities and Culture','Leadership and Governance','Change Over Time','Heritage and Responsibility']},
{id:'civics',name:'Civics',icon:'⚖️',color:'#d9485f',topics:['Rights and Responsibilities','Rules and Leadership','Respect and Inclusion','Community Service','Decision Making']},
{id:'ict',name:'Digital Literacy',icon:'💻',color:'#4f46e5',topics:['Devices and Safety','Files and Folders','Typing and Documents','Information Literacy','Responsible Technology Use']}
];
const WEEKS=Array.from({length:15},(_,i)=>({id:i+1,title:['Foundation and Discovery','Core Skills','Communication','Measurement and Evidence','Problem Solving','Midpoint Review','Application','Research Skills','Creative Thinking','Community and Environment','Independent Practice','Integrated Learning','Revision and Mastery','Mock Assessment','Readiness and Reflection'][i]}));
function defaultState(){return {version:'2.1',profiles:{student:{name:'Brielle',photo:'',learnerId:'EA-BR-001',classLevel:'Primary Level'},homeTeacher:{name:'',photo:'',relationship:'Parent / Home Teacher',contact:''},administrator:{name:'Dr. James K. Mushi, PhD',photo:'',role:'Academic Programme Administrator'}},completedLessons:[],assignments:{},assessments:[],journal:[],observations:[],currentSubject:'math',week:1,createdAt:new Date().toISOString()};}
function migrate(){if(localStorage.getItem(STORAGE_KEY))return;for(const key of LEGACY_KEYS){const value=localStorage.getItem(key);if(value){try{const parsed=JSON.parse(value);const state=defaultState();Object.assign(state,parsed);state.profiles=state.profiles||defaultState().profiles;state.profiles.student=state.profiles.student||defaultState().profiles.student;state.profiles.student.name='Brielle';localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return}catch(e){console.warn('Migration skipped',e)}}}}
migrate();
let state=loadState();
function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');const base=defaultState();if(!saved)return base;return {...base,...saved,profiles:{...base.profiles,...(saved.profiles||{}),student:{...base.profiles.student,...(saved.profiles?.student||{})},homeTeacher:{...base.profiles.homeTeacher,...(saved.profiles?.homeTeacher||{})},administrator:{...base.profiles.administrator,...(saved.profiles?.administrator||{})}}}}catch(e){return defaultState()}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function subject(id){return SUBJECTS.find(s=>s.id===id)||SUBJECTS[0]}
function progressFor(id){const total=WEEKS.length;return Math.min(100,Math.round((state.completedLessons.filter(x=>x.startsWith(id+'-')).length/total)*100));}
function lessonKey(id,week){return `${id}-${week}`}
function lesson(id,week){const s=subject(id);const topic=s.topics[(week-1)%s.topics.length];return {id,week,title:topic,objective:`Build understanding of ${topic.toLowerCase()} through explanation, guided practice and independent application.`,concepts:`Review the key ideas in ${topic.toLowerCase()}. Explain your reasoning, use accurate vocabulary and check your work before submitting.`,practice:[`Define or explain one important idea from ${topic.toLowerCase()}.`,`Work through one example carefully and show each step.`,`Create one question that tests your understanding.`],challenge:`Apply today's learning to a familiar real-life situation and explain your answer.`}}
function currentView(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('sidebar').classList.remove('open');}
function go(name){currentView(name);renderAll();}
function progressBar(value){return `<div class="progress"><span style="width:${value}%"></span></div>`}
function renderDashboard(){const p=state.profiles.student;const completed=state.completedLessons.length;const total=SUBJECTS.length*WEEKS.length;const overall=Math.round(completed/total*100);document.getElementById('view-dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow">Education Access E-Learning Academy v2.1</div><h2>Good morning, ${esc(p.name)}.</h2><p>Your learning space is designed to develop knowledge, confidence, discipline and independent thinking. Every completed lesson is a step forward.</p><div class="hero-stats"><span class="stat-pill">📚 ${completed} lessons completed</span><span class="stat-pill">🎯 ${overall}% learning progress</span><span class="stat-pill">🗓️ Week ${state.week} of 15</span></div></div><img class="profile-large" style="width:110px;height:110px;position:relative;z-index:1" src="${p.photo||placeholder('Brielle')}" alt="Brielle profile photo"></div><div class="section-head"><h2>Quick actions</h2></div><div class="grid grid-4"><button class="action" data-go="courses"><div class="iconbox">📚</div><div><h3>Continue learning</h3><p>Open the next lesson and practise.</p></div></button><button class="action" data-go="assignments"><div class="iconbox">📝</div><div><h3>Assignments</h3><p>Review tasks and submission status.</p></div></button><button class="action" data-go="assessments"><div class="iconbox">📊</div><div><h3>Assessments</h3><p>Check knowledge and reflection.</p></div></button><button class="action" data-go="profiles"><div class="iconbox">👥</div><div><h3>Profiles</h3><p>Manage learner and teacher details.</p></div></button></div><div class="section-head"><h2>My subjects</h2><button class="btn btn-secondary btn-small" data-go="courses">View all</button></div><div class="grid grid-4">${SUBJECTS.map(s=>`<div class="subject"><div class="subject-top"><span style="font-size:27px">${s.icon}</span><span class="badge">${progressFor(s.id)}%</span></div><h3 style="margin-top:16px">${s.name}</h3><p>${WEEKS.length} planned learning units</p>${progressBar(progressFor(s.id))}<button class="btn btn-secondary btn-small" style="margin-top:14px" data-subject="${s.id}">Open subject</button></div>`).join('')}</div><div class="section-head"><h2>Learning support network</h2><span class="badge">Connected learning</span></div><div class="grid grid-3"><div class="card" style="display:flex;align-items:center;gap:14px"><img class="avatar" src="${p.photo||placeholder('Brielle')}" alt="Brielle"><div><strong>${esc(p.name)}</strong><p class="muted">Student learner</p></div></div><div class="card" style="display:flex;align-items:center;gap:14px"><img class="avatar" src="${state.profiles.homeTeacher.photo||placeholder('Home Teacher')}" alt="Home teacher or parent"><div><strong>${esc(state.profiles.homeTeacher.name||'Home teacher / Parent')}</strong><p class="muted">${esc(state.profiles.homeTeacher.relationship||'Learning support')}</p></div></div><div class="card" style="display:flex;align-items:center;gap:14px"><img class="avatar" src="${state.profiles.administrator.photo||placeholder('Dr James')}" alt="Programme administrator"><div><strong>${esc(state.profiles.administrator.name)}</strong><p class="muted">Academic oversight</p></div></div></div><div class="section-head"><h2>Learning principles</h2></div><div class="grid grid-3"><div class="card"><h3>Understand</h3><p class="muted">Learn the concept before memorising the answer.</p></div><div class="card"><h3>Practise</h3><p class="muted">Complete guided and independent work consistently.</p></div><div class="card"><h3>Reflect</h3><p class="muted">Review mistakes and identify the next improvement.</p></div></div>`;}
function renderCourses(){document.getElementById('view-courses').innerHTML=`<div class="section-head"><h2>My Courses</h2><span class="badge">15-week programme</span></div><div class="grid grid-2">${SUBJECTS.map(s=>`<div class="card"><div class="subject-top"><div><h3>${s.icon} ${s.name}</h3><p class="muted">${s.topics.length} topic strands • ${progressFor(s.id)}% completed</p></div><span class="badge">${progressFor(s.id)}%</span></div>${progressBar(progressFor(s.id))}<div style="margin-top:15px;display:flex;flex-wrap:wrap;gap:7px">${s.topics.map(t=>`<span class="badge" style="background:#f5f7fa;color:#516174">${esc(t)}</span>`).join('')}</div><button class="btn btn-primary btn-small" style="margin-top:16px" data-subject="${s.id}">Open learning units</button></div>`).join('')}</div><div id="courseDetail" style="margin-top:20px"></div>`;}
function renderCourseDetail(id){const s=subject(id);const el=document.getElementById('courseDetail');if(!el)return;el.innerHTML=`<div class="card"><div class="section-head" style="margin-top:0"><h2>${s.icon} ${s.name}: learning units</h2><span class="badge">Week ${state.week}</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Learning focus</th><th>Status</th><th></th></tr></thead><tbody>${WEEKS.map(w=>{const done=state.completedLessons.includes(lessonKey(id,w.id));return `<tr><td>Week ${w.id}</td><td><strong>${esc(lesson(id,w.id).title)}</strong><br><span class="muted">${esc(w.title)}</span></td><td>${done?'<span class="badge" style="background:#e8f8f1;color:#11734f">Completed</span>':'<span class="badge">Planned</span>'}</td><td><button class="btn btn-secondary btn-small" data-lesson="${id}|${w.id}">${done?'Review':'Open'}</button></td></tr>`}).join('')}</tbody></table></div></div>`;}
function openLesson(id,week){const l=lesson(id,week);document.getElementById('courseDetail').innerHTML=`<div class="card"><div class="lesson-head"><div><span class="badge">Week ${week} • ${subject(id).name}</span><h2>${esc(l.title)}</h2><p class="muted">${esc(WEEKS[week-1].title)}</p></div><button class="btn btn-secondary btn-small" data-subject="${id}">Back to units</button></div><div class="lesson-body"><h3>Learning objective</h3><p>${esc(l.objective)}</p><h3>Core concept</h3><p>${esc(l.concepts)}</p><h3>Guided practice</h3>${l.practice.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q)}</strong><textarea rows="2" data-practice="${i}" placeholder="Write your response here…"></textarea></div>`).join('')}<h3>Challenge</h3><p>${esc(l.challenge)}</p><textarea id="challengeResponse" rows="3" placeholder="Explain your application…"></textarea><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="completeLessonBtn">Mark lesson complete</button><button class="btn btn-secondary" id="saveReflectionBtn">Save reflection</button></div><p id="lessonMessage" class="muted" style="margin-top:12px"></p></div></div>`;document.getElementById('completeLessonBtn').onclick=()=>{const key=lessonKey(id,week);if(!state.completedLessons.includes(key))state.completedLessons.push(key);save();document.getElementById('lessonMessage').textContent='Lesson completion saved locally.';renderAll();renderCourseDetail(id);};document.getElementById('saveReflectionBtn').onclick=()=>{state.journal.push({date:new Date().toISOString(),subject:id,week,response:document.getElementById('challengeResponse').value});save();document.getElementById('lessonMessage').textContent='Reflection saved locally.';};}
function renderAssignments(){const rows=SUBJECTS.flatMap(s=>WEEKS.slice(0,5).map(w=>({s,w})));document.getElementById('view-assignments').innerHTML=`<div class="section-head"><h2>Assignment Centre</h2><span class="badge">Practice and review</span></div><div class="notice">Assignments are currently stored locally on this device. Private teacher submission and marking should be connected to authenticated storage before public deployment.</div><div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Week</th><th>Task</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(({s,w})=>{const key=lessonKey(s.id,w.id);const done=state.assignments[key]?.status==='submitted';return `<tr><td>${s.icon} ${s.name}</td><td>${w.id}</td><td>${esc(lesson(s.id,w.id).title)} practice</td><td>${done?'<span class="badge" style="background:#e8f8f1;color:#11734f">Submitted</span>':'<span class="badge">Pending</span>'}</td><td><button class="btn btn-secondary btn-small" data-assignment="${s.id}|${w.id}">${done?'Review':'Open'}</button></td></tr>`}).join('')}</tbody></table></div><div id="assignmentDetail"></div></div>`;}
function openAssignment(id,week){const l=lesson(id,week);const key=lessonKey(id,week);document.getElementById('assignmentDetail').innerHTML=`<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:20px"><h3>${subject(id).name} — Week ${week}</h3><p class="muted">Task: Explain the topic, provide one example and identify one question you still have.</p><textarea id="assignmentResponse" rows="5" placeholder="Write the assignment response…">${esc(state.assignments[key]?.response||'')}</textarea><div style="margin-top:12px"><button class="btn btn-primary" id="submitAssignment">Save submission</button></div><p id="assignmentMessage" class="muted"></p></div>`;document.getElementById('submitAssignment').onclick=()=>{state.assignments[key]={status:'submitted',response:document.getElementById('assignmentResponse').value,date:new Date().toISOString()};save();document.getElementById('assignmentMessage').textContent='Assignment saved locally.';renderAssignments();};}
function renderAssessments(){document.getElementById('view-assessments').innerHTML=`<div class="section-head"><h2>Assessments</h2><span class="badge">Formative review</span></div><div class="grid grid-2"><div class="card"><h3>Weekly reflection</h3><p class="muted">Record what you understood, what challenged you and what you will practise next.</p><textarea id="weeklyReflection" rows="5" placeholder="Your reflection…"></textarea><button class="btn btn-primary" id="saveAssessment" style="margin-top:10px">Save reflection</button><p id="assessmentMessage" class="muted"></p></div><div class="card"><h3>Readiness checklist</h3>${['I can explain the main concept in my own words.','I can solve or apply a new example.','I can identify and correct a mistake.','I can ask a clear academic question.'].map((x,i)=>`<label style="display:block;margin:14px 0;font-size:13px"><input type="checkbox" data-ready="${i}"> ${x}</label>`).join('')}</div></div><div class="section-head"><h2>Assessment history</h2></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Record</th></tr></thead><tbody>${state.assessments.length?state.assessments.slice().reverse().map(a=>`<tr><td>${new Date(a.date).toLocaleDateString()}</td><td>${esc(a.type)}</td><td>${esc(a.text)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No assessments recorded yet.</td></tr>'}</tbody></table></div></div>`;document.getElementById('saveAssessment').onclick=()=>{const text=document.getElementById('weeklyReflection').value.trim();if(!text)return;state.assessments.push({date:new Date().toISOString(),type:'Weekly reflection',text});save();document.getElementById('assessmentMessage').textContent='Reflection recorded.';renderAssessments();};}
function renderProgress(){const completed=state.completedLessons.length;const total=SUBJECTS.length*WEEKS.length;document.getElementById('view-progress').innerHTML=`<div class="section-head"><h2>Progress and Readiness</h2><span class="badge">Evidence-based tracking</span></div><div class="grid grid-3"><div class="card"><h3>Overall completion</h3><div style="font-size:38px;font-weight:800;color:var(--blue);margin-top:12px">${Math.round(completed/total*100)}%</div><p class="muted">${completed} of ${total} learning units</p>${progressBar(completed/total*100)}</div><div class="card"><h3>Assignments submitted</h3><div style="font-size:38px;font-weight:800;color:var(--green);margin-top:12px">${Object.values(state.assignments).filter(x=>x.status==='submitted').length}</div><p class="muted">Local submission records</p></div><div class="card"><h3>Reflections</h3><div style="font-size:38px;font-weight:800;color:var(--purple);margin-top:12px">${state.assessments.length}</div><p class="muted">Recorded learning reflections</p></div></div><div class="section-head"><h2>Subject mastery indicators</h2></div><div class="card">${SUBJECTS.map(s=>`<div style="margin:20px 0"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${s.icon} ${s.name}</strong><span class="muted">${progressFor(s.id)}%</span></div>${progressBar(progressFor(s.id))}</div>`).join('')}</div>`;}
function photoField(type,label){const p=state.profiles[type];return `<div class="field"><label>${label} photo</label><input type="file" accept="image/jpeg,image/png,image/webp" data-photo="${type}"><small class="muted">JPG, PNG or WebP; maximum 2 MB. Stored locally in this prototype.</small></div>`;}
function renderProfiles(){const s=state.profiles.student,t=state.profiles.homeTeacher,a=state.profiles.administrator;document.getElementById('view-profiles').innerHTML=`<div class="section-head"><h2>Profile Centre</h2><span class="badge">Three role profiles</span></div><div class="profile-layout"><div class="card profile-card"><img class="profile-large" src="${s.photo||placeholder('Brielle')}" alt="Student photo"><h2>${esc(s.name)}</h2><p class="muted">Student</p><span class="badge">${esc(s.learnerId||'Learner ID not set')}</span><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="muted">${esc(s.classLevel||'Class level not set')}</p></div><div class="card"><h3>Student profile</h3><div class="grid grid-2"><div class="field"><label>Student name</label><input id="studentName" value="${esc(s.name)}"></div><div class="field"><label>Learner ID</label><input id="learnerId" value="${esc(s.learnerId)}"></div><div class="field"><label>Class / academic level</label><input id="classLevel" value="${esc(s.classLevel)}"></div></div>${photoField('student','Student')}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Home teacher / parent</h3><div class="grid grid-2"><div class="field"><label>Name</label><input id="teacherName" value="${esc(t.name)}"></div><div class="field"><label>Relationship</label><input id="teacherRelationship" value="${esc(t.relationship)}"></div><div class="field"><label>Contact (optional)</label><input id="teacherContact" value="${esc(t.contact)}"></div></div>${photoField('homeTeacher','Home teacher / parent')}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Administrator</h3><p class="muted">${esc(a.name)} — ${esc(a.role)}</p>${photoField('administrator','Administrator')}<button class="btn btn-primary" id="saveProfiles">Save profile details</button><p id="profileMessage" class="muted"></p></div></div>`;document.getElementById('saveProfiles').onclick=()=>{s.name=document.getElementById('studentName').value.trim()||'Brielle';s.learnerId=document.getElementById('learnerId').value.trim();s.classLevel=document.getElementById('classLevel').value.trim();t.name=document.getElementById('teacherName').value.trim();t.relationship=document.getElementById('teacherRelationship').value.trim();t.contact=document.getElementById('teacherContact').value.trim();save();document.getElementById('profileMessage').textContent='Profile details saved.';renderAll();};document.querySelectorAll('[data-photo]').forEach(input=>input.addEventListener('change',()=>readPhoto(input,input.dataset.photo)));}
function readPhoto(input,type){const file=input.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2*1024*1024){alert('Select a JPG, PNG or WebP image up to 2 MB.');input.value='';return;}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=480;const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);state.profiles[type].photo=canvas.toDataURL('image/jpeg',0.82);save();renderProfiles();renderDashboard();};img.src=reader.result;};reader.readAsDataURL(file);}
function renderParent(){const t=state.profiles.homeTeacher;document.getElementById('view-parent').innerHTML=`<div class="section-head"><h2>Parent / Home Teacher Workspace</h2><span class="badge">Local prototype</span></div><div class="notice">This area is a planning and monitoring workspace. It is not yet a secure multi-user portal. Do not publish confidential student information until authenticated server-side access is implemented.</div><div class="grid grid-3" style="margin-top:16px"><div class="card"><h3>Student</h3><p>${esc(state.profiles.student.name)}</p><p class="muted">${esc(state.profiles.student.classLevel)}</p></div><div class="card"><h3>Home teacher / parent</h3><p>${esc(t.name||'Not configured')}</p><p class="muted">${esc(t.relationship)}</p></div><div class="card"><h3>Programme administrator</h3><p>${esc(state.profiles.administrator.name)}</p><p class="muted">Academic oversight</p></div></div><div class="section-head"><h2>Monitoring summary</h2></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Indicator</th><th>Current record</th></tr></thead><tbody><tr><td>Lessons completed</td><td>${state.completedLessons.length}</td></tr><tr><td>Assignments submitted</td><td>${Object.values(state.assignments).filter(x=>x.status==='submitted').length}</td></tr><tr><td>Reflections</td><td>${state.assessments.length}</td></tr><tr><td>Current programme week</td><td>${state.week} of 15</td></tr></tbody></table></div></div>`;}
function renderSettings(){document.getElementById('view-settings').innerHTML=`<div class="section-head"><h2>Settings and Data Protection</h2></div><div class="grid grid-2"><div class="card"><h3>Local data backup</h3><p class="muted">Export a backup before changing storage keys, clearing browser data or moving devices.</p><button class="btn btn-primary" id="exportBtn">Export backup</button><button class="btn btn-secondary" id="importBtn" style="margin-left:8px">Import backup</button><input type="file" id="importFile" accept="application/json" hidden><p id="settingsMessage" class="muted"></p></div><div class="card"><h3>Programme controls</h3><div class="field"><label>Current programme week</label><select id="weekSelect">${WEEKS.map(w=>`<option value="${w.id}" ${state.week===w.id?'selected':''}>Week ${w.id} — ${esc(w.title)}</option>`).join('')}</select></div><button class="btn btn-primary" id="saveWeek">Save week</button><div style="margin-top:20px"><button class="btn btn-danger" id="resetBtn">Reset local learning data</button></div></div></div>`;document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='education-access-brielle-backup.json';a.click();URL.revokeObjectURL(url);};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||typeof imported!=='object')throw Error('Invalid');state={...defaultState(),...imported};state.profiles={...defaultState().profiles,...(imported.profiles||{})};state.profiles.student={...defaultState().profiles.student,...(state.profiles.student||{}),name:'Brielle'};save();renderAll();alert('Backup imported. Brielle remains the active learner profile.');}catch(err){alert('Import failed. Please use a valid platform backup.');}};reader.readAsText(file);};document.getElementById('saveWeek').onclick=()=>{state.week=Number(document.getElementById('weekSelect').value);save();renderAll();};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all local learning data? Export a backup first.')){localStorage.removeItem(STORAGE_KEY);state=defaultState();renderAll();}};}
function placeholder(name){const initials=(name||'EA').split(' ').map(x=>x[0]).slice(0,2).join('');return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="100%" height="100%" fill="#dcecff"/><circle cx="120" cy="88" r="42" fill="#8cb8ed"/><path d="M45 220c8-58 45-80 75-80s67 22 75 80" fill="#5c92d4"/><text x="120" y="235" font-size="20" text-anchor="middle" fill="#08264d">${initials}</text></svg>`);}
function renderAll(){document.getElementById('topName').textContent=state.profiles.student.name||'Brielle';document.getElementById('topAvatar').src=state.profiles.student.photo||placeholder('Brielle');renderDashboard();renderCourses();renderAssignments();renderAssessments();renderProgress();renderProfiles();renderParent();renderSettings();}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)go(b.dataset.view);});document.addEventListener('click',e=>{const goBtn=e.target.closest('[data-go]');if(goBtn)go(goBtn.dataset.go);const sub=e.target.closest('[data-subject]');if(sub){go('courses');setTimeout(()=>{renderCourseDetail(sub.dataset.subject);document.getElementById('courseDetail')?.scrollIntoView({behavior:'smooth',block:'start'});},0);}const les=e.target.closest('[data-lesson]');if(les){const [id,w]=les.dataset.lesson.split('|');openLesson(id,Number(w));}const ass=e.target.closest('[data-assignment]');if(ass){const [id,w]=ass.dataset.assignment.split('|');openAssignment(id,Number(w));}});document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.subject,.action,.card').forEach(el=>{if(!q){el.style.display='';return}el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});});renderAll();
</script>
</body>
</html>
