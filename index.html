<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07101d">
<title>Education Access E-Learning Academy v2.0</title>

<style>
:root{
 --bg:#07101d;
 --panel:#0d1929;
 --panel2:#111f33;
 --line:#22334b;
 --text:#edf5ff;
 --muted:#9db0c7;
 --accent:#35d39a;
 --blue:#5ea7ff;
 --warn:#f6c85f;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 line-height:1.5;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 min-height:100vh;
}

.header{
 position:sticky;
 top:0;
 z-index:10;
 background:#07101df2;
 border-bottom:1px solid var(--line);
}

.headerTop{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 max-width:1200px;
 margin:auto;
}

.logo{
 width:44px;
 height:44px;
 border-radius:12px;
 background:linear-gradient(135deg,var(--accent),var(--blue));
 color:#061018;
 display:grid;
 place-items:center;
 font-weight:bold;
}

.brand h1{
 margin:0;
 font-size:17px;
}

.brand small{
 color:var(--muted);
}

.nav{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:8px 12px;
 max-width:1200px;
 margin:auto;
}

.nav button,
.btn{
 border:1px solid var(--line);
 background:var(--panel2);
 color:var(--text);
 border-radius:9px;
 padding:9px 12px;
 white-space:nowrap;
}

.nav button.active,
.btn.primary{
 background:var(--accent);
 color:#03140e;
 font-weight:bold;
}

.wrap{
 max-width:1200px;
 margin:auto;
 padding:15px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(12,1fr);
 gap:12px;
}

.card{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:14px;
 padding:15px;
}

.full{grid-column:span 12}
.half{grid-column:span 6}
.third{grid-column:span 4}

.hero{
 background:linear-gradient(135deg,#0d2635,#0d1929);
}

.muted{
 color:var(--muted);
}

.tag{
 display:inline-block;
 padding:4px 8px;
 margin:2px;
 border:1px solid var(--line);
 border-radius:20px;
 font-size:12px;
 color:var(--muted);
}

.progress{
 height:8px;
 background:#17263a;
 border-radius:10px;
 overflow:hidden;
}

.progress i{
 display:block;
 height:100%;
 background:linear-gradient(90deg,var(--accent),var(--blue));
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px;
}

@media(max-width:700px){
 .half,.third{
  grid-column:span 12;
 }
}
</style>
</head>

function save(){
 localStorage.setItem(
  "EA_Academy_v2_Integrated_V2_1",
  JSON.stringify(state)
 );
}

function load(){
 try{

   localStorage.getItem(

   )
  );

function esc(x){
 return String(x??"")
 .replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

 state.page=page;

function openSubject(key){

 state.subject=key;
 state.week=1;
 state.page="curriculum";

 save();
 render();

}


/* -------- UNIT VIEW -------- */

function showUnit(subject,week){

 const data=UNIT_CONTENT[subject]?.[week];

 if(!data){

  return `
   <div class="card full">
    <h3>
     Week ${week}: ${SUBJECTS[subject].weeks[week-1]}
    </h3>

    <div class="notice">
     This unit is part of the 15-week learning pathway.
     Full learning activities are connected to the
     Academy evidence engine.
    </div>
   </div>
  `;

 }

 return `

 <section class="card full">

  <span class="tag">
   WEEK ${week}
  </span>

  <h2>
   ${SUBJECTS[subject].weeks[week-1]}
  </h2>

  <div class="mission">

   <b>Learning Outcome</b><br>
   ${data.outcome}

  </div>

  <div class="grid">

   <div class="card half">
    <h3>1. DISCOVER</h3>
    <p>${data.discover}</p>
   </div>

   <div class="card half">
    <h3>2. LEARN</h3>
    <ul>
     ${data.learn.map(x=>`<li>${x}</li>`).join("")}
    </ul>
   </div>

   <div class="card half">
    <h3>3. PRACTISE</h3>
    <ol>
     ${data.practise.map(x=>`<li>${x}</li>`).join("")}
    </ol>
   </div>

   <div class="card half">
    <h3>4. APPLY</h3>
    <p>${data.apply}</p>
   </div>

   <div class="card full">
    <h3>5. VOICE</h3>

    <div class="notice">
     ${data.voice}
    </div>

    <button class="btn primary"
     onclick="go('voice')">
     Open Voice Studio
    </button>
   </div>

  </div>

 </section>

`;
}


/* -------- CURRICULUM SCREEN -------- */

function curriculumPage(){

 const key=state.subject||"mathematics";
 const subject=SUBJECTS[key];
 const week=state.week||1;

 return `

 <div class="grid">

  <section class="card full">

   <span class="tag">
    ${subject.icon} ${subject.lab}
   </span>

   <h2>${subject.name}</h2>

   <p class="muted">
    ${subject.signature}
   </p>

   <div class="actions">

    ${Object.entries(SUBJECTS).map(
     ([k,s])=>`
      <button class="btn"
       onclick="openSubject('${k}')">
       ${s.icon} ${s.name}
      </button>
     `
    ).join("")}

   </div>

  </section>


  <section class="card full">

   <h3>Select Learning Week</h3>

   <select onchange="
    state.week=Number(this.value);
    save();
    render();
   ">

    ${subject.weeks.map((w,i)=>`
     <option value="${i+1}"
      ${week===i+1?"selected":""}>
      Week ${i+1}: ${w}
     </option>
    `).join("")}

   </select>

  </section>

  ${showUnit(key,week)}

 </div>

`;
}

function importData(event){

  const reader=new FileReader();
  reader.onload=()=>{

      Object.assign(state,data);
      save();
      render();
      alert("Backup restored successfully.");
    }catch(e){

  };
  reader.readAsText(file);
}

async function startRecording(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      alert("This browser does not support microphone recording.");
      return;
    }

    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    recorder=new MediaRecorder(stream);

    recorder.ondataavailable=e=>{
      if(e.data.size)chunks.push(e.data);
    };

    recorder.onstop=async()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
      const id="audio-"+Date.now();
      await putAudio(id,blob);

      const d=getUnitData(state.subject,state.week);

      state.evidence.push({
        id:"ev-"+Date.now(),
        audioId:id,
        unitKey:unitKey(),
        subject:SUBJECTS[state.subject].title,
        week:state.week,
        topic:d.title,
        learningOutcome:d.outcome,
        type:"Voice Learning Evidence v2.1",
        reflection:"",
        review:"Pending parent review",
        status:"Emerging",
        createdAt:new Date().toISOString()
      });

      stream.getTracks().forEach(t=>t.stop());
      recorder=null;
      chunks=[];
      save();
      await hydrateAudioUrls();
      render();
    };

    recorder.start();
    render();
  }catch(e){
    recorder=null;
    alert("Microphone access was not available. Please allow microphone permission and try again.");
  }
}

function stopRecording(){
  if(recorder&&recorder.state!=="inactive")recorder.stop();
}

async function hydrateAudioUrls(){
  for(const e of state.evidence||[]){
    if(e.audioId&&!e.audioUrl){
      try{
        const blob=await getAudio(e.audioId);
        if(blob)e.audioUrl=URL.createObjectURL(blob);
      }catch(err){}
    }
  }
}

function exportData(){
  const blob=new Blob(

    {type:"application/json"}
  );

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Education-Access-Academy-backup.json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function importData(event){
  const file=event.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);

      Object.assign(state,data);

      save();
      render();

      alert("Academy backup restored.");
    }catch(err){
      alert("Invalid backup file.");
    }
  };

  reader.readAsText(file);
}

<script>
/* =========================================================
   PART 6A — MULTI-STUDENT PROFILE ENGINE v2.2
   Education Access E-Learning Academy
   ========================================================= */

const PROFILE_KEY = "EA_ACADEMY_STUDENT_PROFILES_V22";
const ACTIVE_KEY = "EA_ACADEMY_ACTIVE_STUDENT_V22";

let profiles = {};
let activeProfileId = null;


/* ---------- PROFILE STORAGE ---------- */

function loadProfiles(){
  try{
    profiles = JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}");
  }catch(e){
    profiles = {};
  }

  activeProfileId = localStorage.getItem(ACTIVE_KEY) || null;
}


function persistProfiles(){
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profiles));

  if(activeProfileId){
    localStorage.setItem(ACTIVE_KEY, activeProfileId);
  }else{
    localStorage.removeItem(ACTIVE_KEY);
  }
}


/* ---------- CONNECT LEARNING STATE TO PROFILE ---------- */

const originalSave = save;

save = function(){
  originalSave();

  if(activeProfileId && profiles[activeProfileId]){
    profiles[activeProfileId].learningState =
      JSON.parse(JSON.stringify(state));

    profiles[activeProfileId].updatedAt =
      new Date().toISOString();

    persistProfiles();
  }
};


/* ---------- STUDENT ID ---------- */

function nextStudentId(){
  const numbers = Object.values(profiles)
    .map(p => p.studentId || "")
    .map(id => {
      const m = id.match(/EA-(\d+)/);
      return m ? Number(m[1]) : 0;
    });

  const next = Math.max(0,...numbers) + 1;

  return "EA-" + String(next).padStart(5,"0");
}


/* ---------- CREATE STUDENT ---------- */

function createStudent(data){
  const id =
    "student_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2,7);

  profiles[id] = {
    id:id,

    studentId:nextStudentId(),

    fullName:data.fullName || "",
    preferredName:data.preferredName || data.fullName || "",
    dob:data.dob || "",
    age:data.age || "",

    school:data.school || "",
    level:data.level || "Grade 7 → Form One",

    parent:data.parent || "",
    programme:data.programme || APP.name,
    startDate:data.startDate || "October 2026",

    photo:"",

    mood:"",
    recallHistory:[],

    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),

    learningState:{
      page:"dashboard",
      subject:null,
      week:1,
      tab:"discover",
      completed:{},
      evidence:[],
      journals:{},
      checks:{},
      mastery:{},
      assessments:{}
    }
  };

  activeProfileId = id;

  persistProfiles();

  restoreStudent(id,false);

  state.page = "dashboard";

  save();

  render();
}


/* ---------- RESTORE STUDENT ---------- */

function restoreStudent(id, rerender=true){

  if(!profiles[id]) return;

  activeProfileId = id;

  const p = profiles[id];

  if(p.learningState){
    Object.keys(state).forEach(key => {
      delete state[key];
    });

    Object.assign(
      state,
      JSON.parse(JSON.stringify(p.learningState))
    );
  }

  persistProfiles();

  if(rerender) render();
}


/* ---------- SWITCH STUDENT ---------- */

function switchStudent(id){
  if(!profiles[id]) return;

  activeProfileId = id;

  restoreStudent(id,false);

  state.page = "dashboard";

  save();

  render();
}


/* ---------- LOGOUT ---------- */

function logoutStudent(){

  if(activeProfileId && profiles[activeProfileId]){
    profiles[activeProfileId].learningState =
      JSON.parse(JSON.stringify(state));

    profiles[activeProfileId].updatedAt =
      new Date().toISOString();

    persistProfiles();
  }

  activeProfileId = null;

  localStorage.removeItem(ACTIVE_KEY);

  state.page = "login";

  render();
}


/* ---------- CURRENT STUDENT ---------- */

function student(){
  return activeProfileId
    ? profiles[activeProfileId]
    : null;
}


function studentName(){

  const p = student();

  if(!p) return "Learner";

  return p.preferredName ||
         p.fullName ||
         "Learner";
}


/* ---------- PROFILE PHOTO ---------- */

function handleProfilePhoto(event){

  const file =
    event.target.files &&
    event.target.files[0];

  if(!file || !activeProfileId) return;

  const reader = new FileReader();

  reader.onload = function(){

    profiles[activeProfileId].photo =
      reader.result;

    profiles[activeProfileId].updatedAt =
      new Date().toISOString();

    persistProfiles();

    render();
  };

  reader.readAsDataURL(file);
}


/* ---------- MOOD ---------- */

function saveMood(mood){

  if(!activeProfileId) return;

  profiles[activeProfileId].mood = mood;

  profiles[activeProfileId].updatedAt =
    new Date().toISOString();

  render();
}


/* ---------- PREVIOUS LESSON ---------- */

function previousLesson(){

  const completed =
    Object.keys(state.completed || {});

  if(!completed.length){
    return null;
  }

  const lastKey =
    completed[completed.length - 1];

  const parts =
    lastKey.split("_");

  const subject =
    parts[0];

  const week =
    Number(parts[1]);

  if(!SUBJECTS[subject]) return null;

  const data =
    getUnitData(subject,week);

  return {
    subject:subject,
    week:week,
    data:data
  };

    date:new Date().toISOString(),

    subject:previous.subject,

/* ---------- EXPORT DATA ---------- */

function exportData(){

  const data = {

    exportedAt:
      new Date().toISOString(),

    academy:
      APP.name,

    version:
      APP.version,

    profiles:
      profiles,

    activeProfileId:
      activeProfileId
  };

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "education-access-academy-backup.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}


/* ---------- IMPORT DATA ---------- */

function importData(event){

  const file =
    event.target.files &&
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(){

    try{

      const data =
        JSON.parse(reader.result);

      if(!data.profiles){
        throw new Error(
          "Invalid Academy backup"
        );
      }

      profiles =
        data.profiles;

      activeProfileId =
        data.activeProfileId || null;

      persistProfiles();

      if(activeProfileId){
        restoreStudent(
          activeProfileId,
          false
        );
      }

      alert(
        "Backup imported successfully."
      );

      render();

    }catch(error){

      alert(
        "The selected file is not a valid Academy backup."
      );

    }

  };

  reader.readAsText(file);
}


/* ---------- RESET PROGRESS ---------- */

function resetProgress(){

  if(!confirm(
    "Reset this student's learning progress? This cannot be undone unless you have a backup."
  )){
    return;
  }

  state.completed = {};
  state.evidence = [];
  state.journals = {};
  state.checks = {};
  state.mastery = {};
  state.assessments = {};

  state.page = "dashboard";
  state.subject = null;
  state.week = 1;

  save();

  render();
}

          </div>

  /* ---------- CREATE PROFILE ---------- */

  if(state.page === "createProfile"){

  /* ---------- MAIN APPLICATION ---------- */

  if(state.page === "dashboard"){

    content =
      curriculumFinal();

      learningUnitPage();

  }else if(state.page === "voice"){

    content =
      voicePage();

  }else if(state.page === "journal"){

    content =
      journalPage();

  }else if(state.page === "assessment"){

    content =
      assessmentPageFinal();

  }else if(state.page === "parent"){

    content =
      parentPageFinal();

  }else if(state.page === "profile"){

    content =
      profilePageFinal();

  }else if(state.page === "readiness"){

    content =
      readinessPage();

  }else{

    content =
      dashboardFinal();

  }


  app.innerHTML = `

    <header class="header">

      <div class="headerTop">

        <div class="logo">
          EA
        </div>

        <div class="brand">

          <strong>
            Education Access
          </strong>

          <span>
            E-Learning Academy
          </span>

        </div>

      </div>


      <nav class="nav">

        <button
          onclick="go('assessment')">

        </button>

  `;


  /* ---------- VOICE AUDIO HYDRATION ---------- */

  if(state.page === "voice"){

    setTimeout(() => {

      if(
        typeof hydrateAudioUrls ===
        "function"
      ){

        hydrateAudioUrls();

      }

    },50);

  }

};


/* =========================================================
   INITIALISE MULTI-STUDENT ENGINE
   ========================================================= */

loadProfiles();


if(
  activeProfileId &&
  profiles[activeProfileId]
){

  restoreStudent(
    activeProfileId,
    false
  );

  state.page = "dashboard";

}else{

  activeProfileId = null;

  state.page = "login";

}


/* ---------- FINAL RENDER ---------- */

render();

</script>
